<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Book Showcase Studio | V2 Beta</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="theme.css">
    <style>
        .fade-in-active { animation: fadeIn 0.4s ease-in-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* Tùy chỉnh thanh cuộn cho mượt */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #e5e7eb; border-radius: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
    </style>
</head>
<body class="bg-[var(--bg-main)] text-[var(--text-main)] transition-colors duration-300" style="font-family: var(--font-heading)">

  <header class="border-b border-[var(--border-color)] px-8 py-5 flex justify-between items-center bg-[var(--bg-card)] z-40 relative transition-colors duration-300">
    <div class="font-black tracking-widest text-lg uppercase text-[var(--text-main)]">Curated by Xu</div>
    
    <div class="flex items-center gap-4">
        
        <div class="flex gap-2 text-[10px] font-mono uppercase tracking-wider border-r border-[var(--border-color)] pr-4 text-[var(--text-muted)]">
            <button onclick="setTheme('cream')" class="hover:text-[var(--text-main)] hover:underline">Cream</button>
            <span class="opacity-30">|</span>
            <button onclick="setTheme('gray')" class="hover:text-[var(--text-main)] hover:underline">Gray</button>
            <span class="opacity-30">|</span>
            <button onclick="setTheme('dark')" class="hover:text-[var(--text-main)] hover:underline">Dark</button>
        </div>

        <a href="https://www.instagram.com/xuxudocsach" target="_blank" class="text-xs uppercase font-bold tracking-wider text-[var(--text-main)] border border-[var(--text-main)] px-4 py-2 hover:bg-[var(--text-main)] hover:text-[var(--bg-main)] transition-colors duration-300">
            My Instagram
        </a>
        <a href="https://tienxu04.github.io/xuxucode/bookshelves.html" target="_blank" class="text-xs uppercase font-bold tracking-wider text-[var(--text-muted)] hover:text-[var(--text-main)] transition-colors duration-300 py-2">
            All reviews
        </a>
    </div>
</header>

    <section class="h-[calc(100vh-73px)] grid grid-cols-1 lg:grid-cols-12">
        
        <div class="lg:col-span-5 border-r border-gray-100 bg-white p-8 lg:p-10 overflow-y-auto h-full space-y-12 pb-24">
            
            <div id="status-message" class="text-xs text-gray-400 italic">Initializing catalog...</div>

            <div class="zone-container hidden" id="wrap-authors">
                <h2 class="text-[10px] font-mono uppercase tracking-widest text-gray-400 mb-4 border-b border-gray-100 pb-2">Zone 1: Featured Authors</h2>
                <div id="zone-authors" class="space-y-2"></div>
            </div>

            <div class="zone-container hidden" id="wrap-booksets">
                <h2 class="text-[10px] font-mono uppercase tracking-widest text-gray-400 mb-4 border-b border-gray-100 pb-2">Zone 2: Exclusive Booksets</h2>
                <div id="zone-booksets" class="space-y-2"></div>
            </div>

            <div class="zone-container hidden" id="wrap-collections">
                <h2 class="text-[10px] font-mono uppercase tracking-widest text-gray-400 mb-4 border-b border-gray-100 pb-2">Zone 3: Curated Collections</h2>
                <div id="zone-collections" class="space-y-2"></div>
            </div>

        </div>

        <div class="lg:col-span-7 bg-[#f8f9fa] p-8 lg:p-12 flex flex-col overflow-y-auto h-full relative">
            <div class="w-full max-w-4xl mx-auto space-y-8">
                
                <div class="flex justify-between items-end border-b border-gray-200 pb-3 sticky top-0 bg-[#f8f9fa] z-10 pt-4">
                    <h3 class="text-xs font-bold uppercase tracking-widest text-gray-500">Exhibited Artworks</h3>
                    <span id="preview-item-name" class="text-xs font-mono text-gray-400 bg-white px-2 py-1 border border-gray-200">Select an item</span>
                </div>

                <div id="books-preview-grid" class="grid grid-cols-2 md:grid-cols-3 gap-6 pb-20">
                    <div class="col-span-full flex flex-col items-center justify-center text-gray-300 italic text-sm p-12 h-64">
                        <svg class="w-8 h-8 mb-3 opacity-30" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                        Hover over any item on the left to reveal its collection
                    </div>
                </div>

            </div>
        </div>

    </section>

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="index_logic.js"></script>
</body>
</html>
