<!-- admin_author_form.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Author Debug</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom xíu cho cái Dropzone nhìn "nghệ" hơn */
        .dropzone-active {
            border-color: #000 !important;
            background-color: #f3f4f6 !important;
        }
    </style>
</head>
<body class="bg-gray-50 flex justify-center py-10 font-sans">

    <div class="bg-white border border-gray-200 p-8 w-full max-w-2xl shadow-sm">
        <h2 class="text-2xl font-bold mb-6 border-b pb-2">Add New Author</h2>

        <form id="add-author-form" class="space-y-8">
            
            <!-- KHÂU 1: TÊN TÁC GIẢ -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 uppercase tracking-wider mb-2">1. Author Name</label>
                <input type="text" id="author-name" class="w-full border border-gray-300 p-3 focus:outline-none focus:border-black transition-colors" placeholder="e.g. Alice Feeney">
            </div>

            <!-- KHÂU 2: CHÂN DUNG (DRAG & DROP) -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 uppercase tracking-wider mb-2">2. Profile Picture</label>
                <div id="avatar-dropzone" class="border-2 border-dashed border-gray-300 p-10 text-center cursor-pointer hover:bg-gray-50 transition-all flex flex-col items-center justify-center min-h-[200px]">
                    <div id="dropzone-content">
                        <svg class="w-8 h-8 text-gray-400 mx-auto mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                        <p class="text-gray-500 text-sm">Drag & drop profile picture here</p>
                        <p class="text-gray-400 text-xs mt-1">or click to browse</p>
                    </div>
                    <!-- Chỗ này để hiện ảnh preview sau khi thả -->
                    <img id="avatar-preview" class="hidden max-h-[160px] object-cover mt-2 shadow-sm" src="" alt="Preview">
                </div>
                <input type="file" id="avatar-input" class="hidden" accept="image/*">
            </div>

            <!-- KHÂU 3: INTRO (BIO) -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 uppercase tracking-wider mb-2">3. Introduction</label>
                <textarea id="author-bio" rows="2" class="w-full border border-gray-300 p-3 focus:outline-none focus:border-black transition-colors resize-none" placeholder="1-2 lines about the author..."></textarea>
            </div>

            <!-- KHÂU 4: INSTAGRAM LINKS (DYNAMIC) -->
            <div id="insta-section">
                <label class="block text-sm font-semibold text-gray-700 uppercase tracking-wider mb-2">4. Instagram Links</label>
                <div id="insta-container" class="space-y-3">
                    <!-- Dòng input mặc định đầu tiên -->
                    <div class="flex gap-2 insta-row">
                        <input type="text" class="flex-1 border border-gray-300 p-3 focus:outline-none focus:border-black insta-input" placeholder="Paste Instagram post link...">
                        <button type="button" class="w-12 border border-gray-300 bg-gray-50 hover:bg-black hover:text-white transition-colors flex items-center justify-center font-bold text-lg" onclick="addInstaRow()">+</button>
                    </div>
                </div>
            </div>

            <!-- SUBMIT BUTTON -->
            <div class="pt-4 border-t">
                <button type="button" onclick="debugSubmit()" class="w-full bg-black text-white py-4 font-bold tracking-widest uppercase hover:bg-gray-800 transition-colors">
                    Save Author
                </button>
            </div>

        </form>
    </div>

    <!-- ĐÚNG: Thư viện gốc của Supabase phải đứng TRƯỚC -->
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
    <script src="admin_author_logic.js"></script>
</body>
</html>
