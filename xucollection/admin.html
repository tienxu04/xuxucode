<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio | Control Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-black font-sans antialiased min-h-screen">

    <header class="bg-white border-b border-gray-200 px-8 py-5 flex justify-between items-center sticky top-0 z-40">
        <div class="flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span>
            <h1 class="font-black tracking-widest text-lg uppercase">Admin Portal</h1>
        </div>
        <div class="flex gap-4 items-center">
            <a href="index.html" class="text-xs uppercase font-bold text-gray-400 hover:text-black">View Site ↗</a>
            <a href="add_item.html" class="bg-black text-white px-4 py-2 text-xs font-bold uppercase tracking-wider hover:bg-gray-800">
                + Add Item
            </a>
        </div>
    </header>

    <div class="max-w-4xl mx-auto px-6 py-12">
        <div class="flex justify-between items-end mb-6 border-b border-gray-200 pb-2">
            <h2 class="text-xs font-mono uppercase tracking-widest text-gray-500">Database Directory</h2>
            <span id="total-count" class="text-xs font-bold text-gray-800">0 Items</span>
        </div>

        <div id="admin-item-list" class="space-y-1">
            <p class="text-sm text-gray-400 italic py-4">Fetching database...</p>
        </div>
    </div>

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="admin_logic.js"></script>
</body>
</html>
