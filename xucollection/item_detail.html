<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio | Item Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#fcfcfc] text-black font-sans antialiased min-h-screen">

    <header class="border-b border-gray-100 px-8 py-5 flex justify-between items-center bg-white sticky top-0 z-40">
        <div class="font-black tracking-widest text-lg uppercase flex items-center gap-2">
            <span id="header-dot" class="w-2 h-2 rounded-full bg-gray-400"></span>
            <span>The Studio.</span>
        </div>
        <a href="index.html" class="text-xs uppercase font-bold tracking-wider text-gray-500 hover:text-black transition-colors">
            ← Back to Catalog
        </a>
    </header>

    <div class="max-w-5xl mx-auto px-6 py-12">
        
        <div id="status-message" class="text-center py-12 text-gray-400 italic text-sm">
            Opening the studio archives...
        </div>

        <div id="item-content" class="space-y-12 hidden">
            
            <div class="bg-white border border-gray-100 p-8 flex flex-col md:flex-row gap-8 items-center md:items-start shadow-sm">
                
                <img id="item-thumbnail" src="" alt="Thumbnail" class="w-32 h-32 object-cover border border-gray-100 bg-gray-50 shadow-sm flex-shrink-0 transition-all duration-300">
                
                <div class="flex-1 text-center md:text-left space-y-3">
                    <div class="flex flex-col md:flex-row md:items-center gap-2">
                        <h2 id="item-title-name" class="text-3xl font-black tracking-tight text-gray-900"></h2>
                    </div>
                    
                    <div class="inline-block font-mono text-[10px] font-bold uppercase tracking-widest bg-gray-100 text-gray-500 px-2.5 py-1">
                        Category: <span id="item-type-badge"></span>
                    </div>
                    
                    <p id="item-description" class="text-gray-600 leading-relaxed text-sm pt-2 border-t border-gray-50"></p>
                </div>
            </div>

            <div class="space-y-6">
                <div class="border-b border-gray-200 pb-3 flex justify-between items-center">
                    <h3 id="gallery-title" class="text-xs font-bold uppercase tracking-widest text-gray-400">Exhibited Artworks</h3>
                    <span id="gallery-count" class="bg-black text-white text-[10px] px-2 py-0.5 font-bold font-mono">0 VOL</span>
                </div>

                <div id="books-detail-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-6">
                    </div>
            </div>

        </div>

    </div>

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="item_detail_logic.js"></script>
</body>
</html>
