<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio | Author Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans min-h-screen">

    <div class="bg-white border-b border-gray-200 px-6 py-4 flex justify-between items-center shadow-sm">
        <div class="flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-blue-500"></span>
            <h1 class="font-bold tracking-tight uppercase text-sm">Author Profile Studio</h1>
        </div>
        <div class="flex gap-3">
            <a href="author_list.html" class="border border-gray-300 px-4 py-2 text-xs font-bold text-gray-600 uppercase tracking-wider hover:border-black hover:text-black transition-colors">
                ← Back to List
            </a>
            <a href="admin.html" class="bg-black text-white px-4 py-2 text-xs font-bold uppercase tracking-wider hover:bg-gray-800 transition-colors">
                Dashboard
            </a>
        </div>
    </div>

    <div class="max-w-5xl mx-auto px-6 py-12">
        
        <div id="status-message" class="text-center py-12 text-gray-400 italic text-sm">
            Fetching profile and collection data...
        </div>

        <div id="profile-content" class="space-y-12 hidden">
            
            <div class="bg-white border border-gray-200 p-8 flex flex-col md:flex-row gap-8 items-center md:items-start shadow-sm">
                <img id="author-avatar" src="" alt="Author Avatar" class="w-32 h-32 rounded-full object-cover border bg-gray-100 shadow-sm flex-shrink-0">
                
                <div class="flex-1 text-center md:text-left space-y-3">
                    <h2 id="author-name" class="text-3xl font-bold tracking-tight text-gray-900"></h2>
                    <div class="inline-block font-mono text-xs bg-gray-100 text-gray-500 px-2.5 py-1 rounded">
                        ID: <span id="author-id-tag"></span>
                    </div>
                    <p id="author-bio" class="text-gray-600 leading-relaxed text-base pt-2"></p>
                </div>
            </div>

            <div class="space-y-6">
                <div class="border-b pb-3 flex justify-between items-center">
                    <h3 class="text-lg font-bold uppercase tracking-wider text-gray-700">Connected Books Gallery</h3>
                    <span id="book-count" class="bg-black text-white text-xs px-2.5 py-0.5 font-bold font-mono">0 Vol</span>
                </div>

                <div id="books-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-6">
                    </div>
            </div>

        </div>

    </div>

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="author_detail_logic.js"></script>
</body>
</html>
