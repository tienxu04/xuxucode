<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Book Showcase | V2 Beta</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f4f4f5] text-black font-sans antialiased min-h-screen p-8">

    <header class="flex justify-between items-center mb-12">
        <h1 class="font-black tracking-widest text-2xl uppercase">CMS Showcase</h1>
        <a href="add_item.html" class="bg-black text-white px-5 py-2 text-xs font-bold uppercase tracking-widest hover:bg-gray-800">+ Add New Item</a>
    </header>

    <div class="space-y-16 max-w-7xl mx-auto">
        
        <section>
            <h2 class="text-xs font-mono uppercase tracking-widest text-gray-500 mb-4 border-b pb-2">Zone 1: Featured Authors</h2>
            <div id="zone-authors" class="grid grid-cols-2 md:grid-cols-4 gap-6">
                </div>
        </section>

        <section>
            <h2 class="text-xs font-mono uppercase tracking-widest text-gray-500 mb-4 border-b pb-2">Zone 2: Exclusive Booksets</h2>
            <div id="zone-booksets" class="grid grid-cols-1 md:grid-cols-3 gap-6">
                </div>
        </section>

        <section>
            <h2 class="text-xs font-mono uppercase tracking-widest text-gray-500 mb-4 border-b pb-2">Zone 3: Curated Collections</h2>
            <div id="zone-collections" class="grid grid-cols-1 md:grid-cols-3 gap-6">
                </div>
        </section>

    </div>

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script>
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        document.addEventListener('DOMContentLoaded', async () => {
            const { data: items, error } = await _supabase.from('items').select('*').order('created_at', { ascending: false });
            
            if (error) return console.error(error);

            const zoneAuthors = document.getElementById('zone-authors');
            const zoneBooksets = document.getElementById('zone-booksets');
            const zoneCollections = document.getElementById('zone-collections');

            // Template render chung
            const renderItem = (item) => `
                <div class="bg-white border border-gray-200 p-4 shadow-sm flex items-center gap-4 cursor-pointer hover:border-black transition-colors" onclick="window.location.href='item_detail.html?id=${item.id}'">
                    <img src="${item.avatar_url || 'https://via.placeholder.com/150'}" class="w-12 h-12 ${item.item_type === 'author' ? 'rounded-full' : 'rounded'} object-cover border">
                    <div>
                        <h3 class="font-bold text-sm text-gray-900">${item.name}</h3>
                        <p class="text-[10px] text-gray-400 font-mono uppercase mt-0.5">Type: ${item.item_type}</p>
                    </div>
                </div>
            `;

            // Lọc và đổ data tại chỗ
            const authors = items.filter(i => i.item_type === 'author');
            const booksets = items.filter(i => i.item_type === 'bookset');
            const collections = items.filter(i => i.item_type === 'collection');

            zoneAuthors.innerHTML = authors.length ? authors.map(renderItem).join('') : '<p class="text-xs italic text-gray-400">No authors yet.</p>';
            zoneBooksets.innerHTML = booksets.length ? booksets.map(renderItem).join('') : '<p class="text-xs italic text-gray-400">No booksets yet.</p>';
            zoneCollections.innerHTML = collections.length ? collections.map(renderItem).join('') : '<p class="text-xs italic text-gray-400">No collections yet.</p>';
        });
    </script>
</body>
</html>
