<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tuổi Trẻ Video Downloader v2.0</title>
  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --primary: #0066cc;
      --primary-hover: #004e9e;
      --success: #28a745;
      --success-hover: #218838;
      --text: #333333;
      --border: #e1e4e8;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      max-width: 860px;
      margin: 40px auto;
      padding: 0 20px;
    }
    .container {
      background: var(--card-bg);
      padding: 28px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
      border: 1px solid var(--border);
    }
    h2 {
      margin-top: 0;
      color: #111;
      font-size: 1.4rem;
      border-bottom: 2px solid var(--bg-color);
      padding-bottom: 12px;
    }
    .input-box {
      display: flex;
      gap: 10px;
      margin: 20px 0;
    }
    input[type="text"] {
      flex: 1;
      padding: 12px 14px;
      font-size: 15px;
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
      transition: border 0.2s;
    }
    input[type="text"]:focus {
      border-color: var(--primary);
    }
    button {
      padding: 12px 24px;
      font-size: 15px;
      font-weight: 600;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background-color: var(--primary-hover);
    }
    #status {
      margin-bottom: 16px;
      font-size: 14px;
      font-weight: 500;
      color: #555;
    }
    .error-note {
      background: #fff3cd;
      border-left: 4px solid #ffc107;
      padding: 12px 16px;
      border-radius: 6px;
      font-size: 13.5px;
      margin-bottom: 20px;
      color: #856404;
    }
    .video-item {
      background: #f8f9fa;
      border: 1px solid var(--border);
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .video-item-header {
      font-weight: 600;
      font-size: 15px;
      color: #222;
    }
    .video-url {
      font-family: monospace;
      font-size: 13px;
      color: #555;
      background: #eee;
      padding: 6px 10px;
      border-radius: 4px;
      word-break: break-all;
    }
    .actions {
      display: flex;
      gap: 10px;
      margin-top: 4px;
    }
    .btn-action {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      font-size: 13px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 500;
      cursor: pointer;
      border: none;
    }
    .btn-download {
      background-color: var(--success);
      color: white;
    }
    .btn-download:hover {
      background-color: var(--success-hover);
    }
    .btn-copy {
      background-color: #6c757d;
      color: white;
    }
    .btn-copy:hover {
      background-color: #5a6268;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Trích xuất Video Tuổi Trẻ (Native Fetch)</h2>

    <div id="corsAlert" class="error-note" style="display: none;">
      ⚠️ <strong>Lưu ý về CORS:</strong> Nếu gặp lỗi kết nối, bạn hãy cài thêm tiện ích mở rộng <a href="https://chrome.google.com/webstore/detail/allow-cors-access-control/lhobafalddgcelalagmbfnlajbebmpee" target="_blank">Allow CORS</a> trên Chrome/Brave/Edge để trình duyệt cho phép tải trực tiếp HTML từ domain Tuổi Trẻ.
    </div>

    <div class="input-box">
      <input type="text" id="targetUrl" placeholder="Dán URL bài viết Tuổi Trẻ vào đây..." />
      <button onclick="extractMedia()">Lấy Video</button>
    </div>

    <div id="status"></div>
    <div id="results"></div>
  </div>

  <script>
    async function extractMedia() {
      const urlInput = document.getElementById('targetUrl').value.trim();
      const statusDiv = document.getElementById('status');
      const resultsDiv = document.getElementById('results');
      const corsAlert = document.getElementById('corsAlert');

      if (!urlInput) {
        alert("Vui lòng nhập URL bài viết!");
        return;
      }

      statusDiv.innerText = "Đang tải dữ liệu trang bài viết...";
      resultsDiv.innerHTML = "";
      corsAlert.style.display = "none";

      try {
        // Gửi request trực tiếp với mode cors/no-cors fallback
        const response = await fetch(urlInput, {
          method: 'GET',
          headers: {
            'Accept': 'text/html'
          }
        });

        if (!response.ok) {
          throw new Error(`HTTP Error Status: ${response.status}`);
        }

        const htmlText = await response.text();
        parseHtmlAndRender(htmlText, resultsDiv, statusDiv);

      } catch (err) {
        console.error(err);
        statusDiv.innerHTML = `<span style="color: #d9534f;">❌ Không thể truy cập bài viết (${err.message}).</span>`;
        corsAlert.style.display = "block";
      }
    }

    function parseHtmlAndRender(html, container, status) {
      const parser = new DOMParser();
      const doc = parser.parseFromString(html, "text/html");

      // Tìm tất cả các thẻ chứa thông tin video
      const videoNodes = doc.querySelectorAll('div[data-vid], div.VCSortableInPreviewMode');
      const foundLinks = [];

      videoNodes.forEach((node) => {
        let vid = node.getAttribute('data-vid');
        if (vid) {
          if (!vid.startsWith('http')) vid = 'https://' + vid;
          
          // Lấy chú thích
          const caption = node.querySelector('.VideoCMS_Caption p');
          const title = caption ? caption.innerText.trim() : 'Video bài viết';

          foundLinks.push({ url: vid, title: title });
        }
      });

      // Nếu querySelector bị bỏ qua do HTML cấu trúc khác, quét bằng Regex
      if (foundLinks.length === 0) {
        const regex = /data-vid=["']([^"']+)["']/g;
        let match;
        while ((match = regex.exec(html)) !== null) {
          let vid = match[1];
          if (!vid.startsWith('http')) vid = 'https://' + vid;
          if (!foundLinks.some(item => item.url === vid)) {
            foundLinks.push({ url: vid, title: 'Video trích xuất (Regex)' });
          }
        }
      }

      if (foundLinks.length === 0) {
        status.innerText = "Báo cáo: Không tìm thấy video nào trong mã nguồn bài viết này.";
        return;
      }

      status.innerText = `Tìm thấy ${foundLinks.length} video:`;

      foundLinks.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'video-item';
        card.innerHTML = `
          <div class="video-item-header">#${index + 1}. ${escapeHtml(item.title)}</div>
          <div class="video-url">${escapeHtml(item.url)}</div>
          <div class="actions">
            <a href="${item.url}" target="_blank" download class="btn-action btn-download">
              📥 Tải Video / Mở Tab Mới
            </a>
            <button onclick="copyToClipboard('${item.url}')" class="btn-action btn-copy">
              📋 Copy Link
            </button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function copyToClipboard(text) {
      navigator.clipboard.writeText(text).then(() => {
        alert("Đã copy link video vào clipboard!");
      });
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
  </script>

</body>
</html>
